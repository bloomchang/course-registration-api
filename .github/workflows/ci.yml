name: API quality gate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt black pytest pytest-cov httpx
      - name: Lint with Black
        run: python -m black --check .
      - name: Pytest and coverage (80% minimum)
        run: >-
          python -m pytest --cov=main --cov=students --cov=audit
          --cov-report=term-missing --cov-fail-under=80
      - name: Integration tests against live API
        env:
          CI_API_BASE_URL: http://127.0.0.1:8000
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 1 "$CI_API_BASE_URL/"
          python -m pytest -v tests/test_api.py tests/test_students.py
